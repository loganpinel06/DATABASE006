<!-- Had AI Generate the HTML for the frontend to match the wireframe -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painting Editor</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #e6edf2;
      color: #2c3640;
    }

    header {
      background: #a3afb8;
      padding: 14px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 1.3rem;
      color: #2c3640;
    }

    /* Two columns: list on the left, form on the right */
    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 52px);
    }

    /* ---------- Left: scrollable painting list ---------- */
    #painting-list {
      list-style: none;
      margin: 0;
      padding: 12px;
      overflow-y: auto;
      background: #c3d0d9;
    }

    #painting-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 8px;
    }

    #painting-list li.selected {
      background: #a9bac6;
    }

    #painting-list img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .painting-button {
      flex: 1;
      background: #3d4955;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 10px;
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .painting-button:hover {
      background: #56687a;
    }

    /* ---------- Right: edit form ---------- */
    #editor {
      overflow-y: auto;
      padding: 24px 32px;
    }

    #empty-message {
      color: #6b7a87;
    }

    #edit-form {
      display: none; /* shown once a painting is clicked */
      max-width: 760px;
    }

    #form-title {
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 2px solid #c3d0d9;
    }

    fieldset {
      background: white;
      border: 2px solid #d3dbe1;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 0 0 20px;
    }

    legend {
      font-weight: bold;
      padding: 0 6px;
    }

    .row {
      display: flex;
      gap: 16px;
    }

    .row label {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    input, textarea {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 8px;
      border: 1px solid #b8c3cc;
      border-radius: 4px;
      font: inherit;
    }

    input[readonly] {
      background: #f0f3f5;
      color: #6b7a87;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .buttons button {
      padding: 10px 28px;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #save-button {
      background: #3d4955;
      color: white;
    }

    #save-button:hover {
      background: #56687a;
    }

    #reset-button {
      background: #a3afb8;
      color: #2c3640;
    }

    #reset-button:hover {
      background: #b9c3ca;
    }

    #saved-message {
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Painting Editor</h1>
  </header>

  <main>
    <!-- Left side: filled in by JavaScript -->
    <ul id="painting-list"></ul>

    <!-- Right side: the edit form -->
    <section id="editor">
      <p id="empty-message">Select a painting on the left to edit it.</p>

      <form id="edit-form" action="/update" method="POST">
        <h2 id="form-title"></h2>
        <p id="saved-message"></p>

        <!-- Tells the server which painting to update -->
        <input type="hidden" name="PaintingID" id="PaintingID">

        <fieldset>
          <legend>Basic Info</legend>
          <label>Title
            <input type="text" name="Title" id="Title" required>
          </label>
          <div class="row">
            <label>Artist
              <input type="text" id="Artist" readonly>
            </label>
            <label>Gallery
              <input type="text" id="Gallery" readonly>
            </label>
          </div>
          <div class="row">
            <label>Year of Work
              <input type="number" name="YearOfWork" id="YearOfWork">
            </label>
            <label>Medium
              <input type="text" name="Medium" id="Medium">
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Size &amp; Price</legend>
          <div class="row">
            <label>Width (cm)
              <input type="number" name="Width" id="Width">
            </label>
            <label>Height (cm)
              <input type="number" name="Height" id="Height">
            </label>
          </div>
          <div class="row">
            <label>Cost ($)
              <input type="number" step="any" name="Cost" id="Cost">
            </label>
            <label>MSRP ($)
              <input type="number" step="any" name="MSRP" id="MSRP">
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Details</legend>
          <label>Wikipedia Link
            <input type="url" name="WikiLink" id="WikiLink">
          </label>
          <label>Description
            <textarea name="Description" id="Description"></textarea>
          </label>
        </fieldset>

        <div class="buttons">
          <button type="submit" id="save-button">Save</button>
          <button type="reset" id="reset-button">Reset</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    //define the folder that holds the painting images (relative path as suggested)
    const IMAGE_FOLDER = 'art/works/square-medium/';

    //define a defautl iamge to show when a painting's image file is missing: a plain gray square
    const DEFAULT_IMAGE = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72">' +
      '<rect width="72" height="72" fill="#9aa7b1"/>' +
      '<text x="36" y="40" font-size="10" text-anchor="middle" fill="white">No image</text>' +
      '</svg>'
    );

    //the form fields that come straight from a database column
    const FIELDS = ['PaintingID', 'Title', 'YearOfWork', 'Medium',
      'Width', 'Height', 'Cost', 'MSRP', 'WikiLink', 'Description'];

    //get the list and form from the dom
    const list = document.getElementById('painting-list');
    const form = document.getElementById('edit-form');

    //define an array to hold everything returned from our paintings api
    let paintings = [];
    //define the current painting
    let currentPainting = null;

    //get paintings from the server
    async function loadPaintings() {
      const response = await fetch('/paintings');
      paintings = await response.json();
      //console log to confirm paintings were loaded
      console.log('Loaded', paintings.length, 'paintings');

      //loop through each painting to update the list
      paintings.forEach(painting => {
        const item = document.createElement('li');
        item.dataset.id = painting.PaintingID;

        const img = document.createElement('img');
        img.src = IMAGE_FOLDER + painting.ImageFileName + '.jpg';
        img.alt = painting.Title;
        img.onerror = () => {
          img.onerror = null;      // only try the fallback once
          img.src = DEFAULT_IMAGE;
        };

        const button = document.createElement('button');
        button.className = 'painting-button';
        button.textContent = painting.Title;
        button.addEventListener('click', () => showPainting(painting));

        item.append(img, button);
        list.append(item);
      });

      //after a save the server sends us to /?saved=ID, so reopen that painting
      const savedId = new URLSearchParams(window.location.search).get('saved');
      if (savedId) {
        const saved = paintings.find(p => p.PaintingID === Number(savedId));
        if (saved) {
          showPainting(saved);
          document.getElementById('saved-message').textContent = 'Changes saved!';
          list.querySelector(`li[data-id="${savedId}"]`).scrollIntoView({ block: 'center' });
        }
      }
    }

    //fill in the form for a specific painting when clicked
    function showPainting(painting) {
      currentPainting = painting;

      FIELDS.forEach(field => {
        //?? '' turns null (empty in the database) into an empty box
        document.getElementById(field).value = painting[field] ?? '';
      });

      // Read-only fields that come from the Artists and Galleries tables
      const artistName = [painting.FirstName, painting.LastName].filter(Boolean).join(' ');
      document.getElementById('Artist').value = artistName;
      document.getElementById('Gallery').value = painting.GalleryName ?? '';

      document.getElementById('form-title').textContent = painting.Title;
      document.getElementById('saved-message').textContent = '';
      document.getElementById('empty-message').style.display = 'none';
      form.style.display = 'block';

      //highlight the selected painting in the list
      list.querySelectorAll('li').forEach(li => {
        li.classList.toggle('selected', li.dataset.id === String(painting.PaintingID));
      });
    }

    //Reset puts back the painting's saved values (not blank boxes)
    form.addEventListener('reset', event => {
      event.preventDefault();
      if (currentPainting) showPainting(currentPainting);
    });

    loadPaintings();
  </script>
</body>
</html>
